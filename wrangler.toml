# FleetCare — Cloudflare Workers 배포 설정
#
#   worker.js  : 관리자에서 저장한 문구를 페이지에 끼워 넣고 /api/* 를 처리하는 코드
#   site/      : 실제로 서비스되는 정적 파일 (HTML, CSS, 이미지)
#
# 배포:  npx wrangler deploy

name = "fleetcare"
main = "worker.js"
compatibility_date = "2026-08-28"

# 임시 주소(fleetcare.jdgp.workers.dev)를 남겨둔다.
# 도메인이 정상 동작하면 false 로 바꿔서 꺼도 된다.
workers_dev = true

# 버전별 미리보기 주소는 만들지 않는다.
# 같은 내용이 여러 주소로 검색에 잡히는 걸 막기 위함.
preview_urls = false

# 사용자 도메인. 이 설정으로 배포하면 DNS 레코드가 자동 생성된다.
[[routes]]
pattern = "fleetcare.co.kr"
custom_domain = true

[[routes]]
pattern = "www.fleetcare.co.kr"
custom_domain = true

[assets]
directory = "./site"
binding = "ASSETS"
# 요청이 들어오면 파일보다 worker.js 를 먼저 실행한다.
# 이래야 저장해 둔 문구를 HTML 에 끼워 넣을 수 있다.
run_worker_first = true

[observability]
enabled = true

# KV 네임스페이스 — 관리자에서 고친 문구가 여기에 저장된다.
# 상담 폼 메일 발송.
# Cloudflare Email Routing 에서 아래 주소를 Destination 으로 인증해야 동작한다.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "jdgp@jdgp.co.kr"

[[kv_namespaces]]
binding = "CONTENT"
id = "be823f5f70014d84b318a6c454af6271"

# ADMIN_PASSWORD 는 이 파일에 적지 않는다 (비밀번호이므로).
# Cloudflare 대시보드 > fleetcare > 설정 > Variables and Secrets 에서 Secret 으로 추가한다.
